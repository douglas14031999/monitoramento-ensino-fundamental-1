    rel="stylesheet">
  <style>
    :root {
      --bg: #F1F6F2;
      --sf: #fff;
      --ink: #17352A;
      --mut: #5E7268;
      --ln: #DCE7DF;
      --g: #2F7D5B;
      --gd: #1F5C43;
      --o: #F47B20;
      --p: #E8005F;
      --gs: #E4F2EA;
      --os: #FFEBDA;
      --ps: #FDE3EC;
      --navy: #173F31;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0E1713;
        --sf: #16231D;
        --ink: #E6F0E9;
        --mut: #9BB0A3;
        --ln: #27382F;
        --g: #4FB586;
        --gd: #3FA073;
        --gs: #173626;
        --os: #3B2612;
        --ps: #3C1627;
        --navy: #E6F0E9;
        color-scheme: dark
      }
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased
    }

    [hidden] {
      display: none !important
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit
    }

    :focus-visible {
      outline: 3px solid var(--g);
      outline-offset: 2px;
      border-radius: 8px
    }

    .band {
      height: 8px;
      background: linear-gradient(90deg, #2F7D5B 0 45%, #F47B20 45% 72%, #E8005F 72%)
    }

    #login {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(900px 500px at 12% -10%, rgba(47, 125, 91, .18), transparent 60%), radial-gradient(700px 420px at 100% 110%, rgba(244, 123, 32, .16), transparent 60%), var(--bg)
    }

    #login main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      gap: 26px
    }

    .plate {
      background: #fff;
      border-radius: 20px;
      padding: 14px 24px;
      box-shadow: 0 18px 50px -20px rgba(23, 63, 49, .35);
      display: inline-flex
    }

    .plate img {
      display: block;
      width: min(340px, 70vw);
      height: auto
    }

    .panel {
      width: min(460px, 100%);
      background: var(--sf);
      border: 1px solid var(--ln);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 24px 60px -30px rgba(23, 63, 49, .45)
    }

    #login .plate {
      width: min(460px, 100%);
      justify-content: center
    }

    .panel h1 {
      margin: 0 0 4px;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -.01em;
      color: var(--navy)
    }

    .panel p {
      margin: 0 0 20px;
      color: var(--mut);
      font-size: .95rem
    }

    label {
      display: block;
      font-weight: 600;
      font-size: .85rem;
      margin-bottom: 6px
    }

    input,
    select {
      width: 100%;
      height: 46px;
      border-radius: 12px;
      border: 1.5px solid var(--ln);
      background: var(--bg);
      padding: 0 14px;
      font-weight: 500
    }

    input:focus,
    select:focus {
      border-color: var(--g);
      outline: none;
      box-shadow: 0 0 0 4px rgba(47, 125, 91, .18)
    }

    .big {
      height: 54px;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: .04em;
      flex: 1 1 200px
    }

    .field {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    .btn {
      height: 46px;
      padding: 0 22px;
      border: 0;
      border-radius: 12px;
      background: var(--g);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: .15s;
      white-space: nowrap
    }

    .btn:hover {
      background: var(--gd)
    }

    .btn:active {
      transform: translateY(1px)
    }

    :root[data-theme="dark"] .btn {
      color: #06140E
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) .btn {
        color: #06140E
      }
    }

    .field .btn {
      height: 54px
    }

    .ghost {
      height: 40px;
      padding: 0 16px;
      border-radius: 10px;
      border: 1.5px solid var(--ln);
      background: transparent;
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px
    }

    .ghost:hover {
      border-color: var(--g);
      color: var(--g);
      text-decoration: none
    }

    .spin {
      display: inline-block;
      animation: spin .8s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .dan {
      height: 34px;
      padding: 0 12px;
      border-radius: 9px;
      border: 1.5px solid var(--ln);
      background: transparent;
      color: var(--p);
      font-weight: 600;
      cursor: pointer;
      font-size: .85rem
    }

    .dan:hover {
      background: var(--ps)
    }

    .err {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--ps);
      color: #B0003F;
      font-size: .92rem;
      font-weight: 500
    }

    :root[data-theme="dark"] .err {
      color: #FFA8C4
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) .err {
        color: #FFA8C4
      }
    }

    .demo {
      margin-top: 16px;
      font-size: .78rem;
      color: var(--mut);
      text-align: center
    }

    footer.f {
      padding: 16px;
      text-align: center;
      color: var(--mut);
      font-size: .8rem
    }

    .top {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 5;
      background: var(--sf);
      border-bottom: 1px solid var(--ln)
    }

    .top .in {
      max-width: 1080px;
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 14px
    }

    .top .plate {
      padding: 4px 6px;
      border-radius: 12px;
      box-shadow: none;
      border: 1px solid var(--ln)
    }

    .top .plate img {
      width: 46px
    }

    .ttl {
      flex: 1;
      min-width: 0;
      font-weight: 700;
      line-height: 1.2
    }

    .ttl small {
      display: block;
      font-weight: 500;
      color: var(--mut);
      font-size: .8rem
    }

    .chip {
      font-size: .85rem;
      font-weight: 600;
      background: var(--gs);
      color: var(--gd);
      padding: 6px 12px;
      border-radius: 99px
    }

    :root[data-theme="dark"] .chip,
    .dk .chip {
      color: var(--g)
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 26px 20px 56px
    }

    .hello h2 {
      margin: 0;
      font-size: clamp(1.4rem, 3.4vw, 2rem);
      font-weight: 800;
      letter-spacing: -.02em;
      color: var(--navy)
    }

    .hello p {
      margin: 6px 0 20px;
      color: var(--mut)
    }

    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      background: var(--sf);
      border: 1px solid var(--ln);
      border-radius: 14px;
      padding: 6px
    }

    .tabs button {
      border: 0;
      background: transparent;
      padding: 9px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: .92rem;
      color: var(--mut)
    }

    .tabs button.on {
      background: var(--g);
      color: #fff
    }

    .card {
      background: var(--sf);
      border: 1px solid var(--ln);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px -22px rgba(23, 63, 49, .4)
    }

    .card h3 {
      margin: 0 0 14px;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--navy)
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      align-items: end
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 16px
    }

    .kpi {
      background: var(--sf);
      border: 1px solid var(--ln);
      border-radius: 16px;
      padding: 16px
    }

    .kpi b {
      display: block;
      font-size: 1.9rem;
      font-weight: 800;
      line-height: 1.1
    }

    .kpi small {
      color: var(--mut);
      font-weight: 500
    }

    .kpi.a {
      background: var(--gs)
    }

    .kpi.b {
      background: var(--os)
    }

    .kpi.c {
      background: var(--ps)
    }

    .kpi.d {
      background: var(--sf)
    }

    .two {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 16px
    }

    .pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px
    }

    @media(max-width:760px) {

    }

    .item small {

    }

    }

    }

    }

    .yrbar label {

    }

    }

    .row .chk input {

      font-size: .78rem;
      color: var(--mut);
      margin: 2px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .diag-card-pct {
      font-size: .72rem;
      font-weight: 600;
    }

    /* Barra de ferramentas nativa */
    .table-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      padding: 10px 14px;
      background: var(--bg);
      border-radius: 12px;
      border: 1px solid var(--ln);
    }
    .search-box input {
      height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1.5px solid var(--ln);
      background: var(--sf);
      font-size: .86rem;
      width: 260px;
    }
    .search-box input:focus {
      border-color: var(--g);
      outline: none;
    }
    .filter-pills {
      display: flex;
      gap: 6px;
    }
    .filter-btn {
      height: 32px;
      padding: 0 12px;
      border-radius: 99px;
      border: 1px solid var(--ln);
      background: var(--sf);
      font-size: .8rem;
      font-weight: 600;
      color: var(--mut);
      cursor: pointer;
    }
    .filter-btn:hover {
      border-color: var(--g);
      color: var(--ink);
    }
    .filter-btn.on {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    /* Select nativo refinado */
    .eval-select {
      height: 38px;
      width: 100%;
      min-width: 170px;
      border-radius: 8px;
      border: 1.5px solid var(--ln);
      padding: 0 10px;
      font-weight: 600;
      font-size: .86rem;
      cursor: pointer;
      background-color: var(--sf);
      color: var(--ink);
    }

    .badge-status-row {
      display: inline-block;
      font-size: .76rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 99px;
      white-space: nowrap;
    }
    .badge-status-row.ok {
      background: var(--gs);
      color: var(--gd);
    }
    .badge-status-row.parcial {
      background: var(--os);
      color: #B45309;
    }
    .badge-status-row.pendente {
      background: var(--bg);
      color: var(--mut);
      border: 1px solid var(--ln);
    }

    /* Barra de Salvar no final da página (fixa no fluxo do documento, sem flutuar) */
    .sticky-save-bar {
      position: static;
      background: var(--sf);
      border: 1.5px solid var(--ln);
      border-radius: var(--rd);
      padding: 14px 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }
    .ssb-info b {
      font-size: .92rem;
      color: var(--navy);
    }
    .ssb-info small {
      font-size: .8rem;
      color: var(--mut);
    }
  
  </style>
</head>

  <script>
    /* ===== CONFIGURAÇÃO: cole aqui a URL do App da Web (termina em /exec) ===== */
    const API_URL = "https://script.google.com/macros/s/AKfycbxXJGcXCvjIq1S9Ac801VFfwBNk-uFu_ck5Wgr3SEXmXtKRrAheWj6dj9sjEywLG_-k/exec";
    /* ============================================================================ */
    const TK = "semed_fund1_sessao_v2";
    const CK = "semed_fund1_cache_v2";
    const CR = "semed_fund1_cred_v2";
    const vazio = () => ({ levels: [], students: [], cur: "", years: [], schools: [], classes: [], periods: [], coords: [], admins: [], rec: {} });
    const S0 = () => ({ user: null, tab: "resumo", fs: "", fl: "", fp: "", ft: "", sid: null, cid: null, pid: null, err: "", dv: "todos" });
    let D = vazio(), TOK = "", chain = Promise.resolve(), pend = 0, needSync = false;
    let autoTimer = null, autoBusy = false;
    let S = S0();
    let currentSessionId = 1;
    let _warmed = false;
    function warmServer() {
      if (_warmed) return;
      _warmed = true;
      fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ a: "ping" }), mode: "no-cors" }).catch(() => { });
    }

    function normalizeShift(str) {
      if (!str) return "";
      const s = String(str).trim().toLowerCase();
      if (s.includes("mat") || s.includes("manh")) return "Matutino";
      if (s.includes("vesp") || s.includes("tard")) return "Vespertino";
      if (s.includes("not") || s.includes("noit")) return "Noturno";
      if (s.includes("integ")) return "Integral";
      return "";
    }
    const sLid = (s, c) => (s && s.lid) || (c && c.lid !== "multi" ? c.lid : "") || "";
    function normalizarAlunos(students, classes) {
      if (!students || !Array.isArray(students)) return;
      students.forEach(s => {
        if (!s.lid && s.name) {
          const m = s.name.match(/\s*[-–(\[]\s*([1-5]º?\s*Ano|[1-5]º?)\s*[\)\]]?/i);
          if (m) {
            const num = m[1].replace(/\D/g, "");
            const found = D.levels.find(l => l.name.includes(num + "º"));
            if (found) s.lid = found.id;
            s.name = s.name.replace(m[0], "").trim();
          }
        } else if (s.lid && s.name) {
          s.name = s.name.replace(/\s*[-–(\[]\s*([1-5]º?\s*Ano|[1-5]º?)\s*[\)\]]?/gi, "").trim();
        }
        const c = classes?.find(cl => cl.id == s.cid);
        if (c && c.lid != "multi" && !s.lid) {
          s.lid = c.lid;
        }
      });
    }
    function normalizarTurmas(classes) {
      if (!classes || !Array.isArray(classes)) return;
      classes.forEach(c => {
        if (c.lid === "multi" || /\[Multiano\]/i.test(c.name)) {
          c.lid = "multi";
          c.name = (c.name || "").replace(/\s*\[Multiano\]\s*/gi, " ").trim();
        }
        if (!c.shift && c.name) {
          const m = c.name.match(/\s*[-–(\[]\s*(Matutino|Vespertino|Noturno|Integral|Manhã|Tarde|Noite)\s*[\)\]]?/i);
          if (m) {
            c.shift = normalizeShift(m[1]);
            c.name = c.name.replace(m[0], "").trim();
          }
        } else if (c.shift && c.name) {
          c.shift = normalizeShift(c.shift) || c.shift;
          c.name = c.name.replace(/\s*[-–(\[]\s*(Matutino|Vespertino|Noturno|Integral|Manhã|Tarde|Noite)\s*[\)\]]?/gi, "").trim();
        }
      });
    }

    try {
      TOK = localStorage.getItem(TK) || "";
      const cached = localStorage.getItem(CK);
      if (cached) {
        const r = JSON.parse(cached);
        if (r && r.data) {
          const isDummy = !r.data.schools || r.data.schools.length <= 3 || (r.data.students && r.data.students.some(s => s.name && s.name.startsWith("Aluno ")));
          if (isDummy && typeof DADOS_REAIS !== "undefined") {
            D = Object.assign(vazio(), JSON.parse(JSON.stringify(DADOS_REAIS)));
          } else {
            D = Object.assign(vazio(), r.data);
          }
          if (D.periods) {
            D.periods.forEach(p => { if (!p.yid) p.yid = D.cur || "y1"; });
          }
          normalizarTurmas(D.classes);
          normalizarAlunos(D.students, D.classes);
          if (r.role == "admin") {
            S.user = { role: "admin" };
            S.tab = "resumo";
            S.yr = D.cur;
            S.fp = "";
          } else if (r.role == "coord") {
            S.user = { role: "coord", name: r.name, sids: D.schools.map(s => s.id) };
            S.sid = S.user.sids.length == 1 ? S.user.sids[0] : null;
            S.pid = D.periods.filter(p => p.open && p.yid == D.cur)[0]?.id || null;
          }
        }
      } else if (typeof DADOS_REAIS !== "undefined") {
        D = Object.assign(vazio(), JSON.parse(JSON.stringify(DADOS_REAIS)));
        if (D.periods) {
          D.periods.forEach(p => { if (!p.yid) p.yid = D.cur || "y1"; });
        }
        normalizarTurmas(D.classes);
        normalizarAlunos(D.students, D.classes);
      }
    } catch (e) { }

    const setTok = t => { TOK = t || ""; try { t ? localStorage.setItem(TK, t) : localStorage.removeItem(TK) } catch (e) { } };
    /* CPF: 11 números, não todos iguais e dígitos verificadores corretos (o servidor confere de novo) */
    const cpfOk = c => { if (!/^\d{11}$/.test(c) || /^(\d)\1{10}$/.test(c)) return false; for (let t = 9; t < 11; t++) { let s = 0; for (let i = 0; i < t; i++)s += c[i] * (t + 1 - i); if ((s * 10 % 11) % 10 != c[t]) return false } return true };
    /* ---- chamadas ao servidor (text/plain evita o "preflight" CORS do Apps Script) ---- */
    async function api(body) {
      if (API_URL.includes("COLE_AQUI")) return { ok: false, net: true, err: "Sistema ainda não configurado: defina API_URL no arquivo index.html." };
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 60000);
      try {
        const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body), signal: ctl.signal, redirect: "follow" });
        return await r.json()
      }
      catch (e) { return { ok: false, net: true, err: "Sem conexão com o servidor. Verifique a internet e tente novamente." } }
      finally { clearTimeout(tm) }
    }
    const stat = () => { const e = $("#sv"); if (e) e.hidden = !pend };
    /* gravações entram numa fila (uma por vez, na ordem). A tela já mostra a mudança; se o servidor recusar, avisa e recarrega a verdade da planilha */
    function commit(ops, wait) {
      pend++; stat();
      const p = chain.then(() => api({ a: "write", token: TOK, ops }));
      chain = p.then(() => { }, () => { });
      return p.then(async r => {
        pend--; stat();
        if (!r.ok) { if (r.code == "auth") expirou(r.err); else if (!wait) { needSync = true; alert(r.err || "Não foi possível salvar.") } }
        if (!pend && needSync) { needSync = false; await recarregar(true) }
        return r
      })
    }
    const ser = (k, o) => {
      const c = JSON.parse(JSON.stringify(o));
      if (k == "levels") c.ord = D.levels.indexOf(o);
      if (k == "inds") c.ord = D.inds.indexOf(o);
      if (k == "students") {
        const cleanName = (c.name || "").replace(/\s*[-–(\[]\s*([1-5]º?\s*Ano|[1-5]º?)\s*[\)\]]?/gi, "").trim();
        const parentClass = D.classes.find(cl => cl.id == c.cid);
        if (parentClass && parentClass.lid == "multi" && c.lid) {
          c.name = cleanName + " [" + lname(c.lid) + "]";
        } else {
          c.name = cleanName;
        }
        if (!c.lid && parentClass && parentClass.lid != "multi") {
          c.lid = parentClass.lid;
        }
      }
      if (k == "classes") {
        const isMulti = c.lid === "multi" || /\[Multiano\]/i.test(c.name);
        const sh = normalizeShift(c.shift);
        let cleanName = (c.name || "")
          .replace(/\s*\[Multiano\]\s*/gi, " ")
          .replace(/\s*[-–(\[]\s*(Matutino|Vespertino|Noturno|Integral|Manhã|Tarde|Noite)\s*[\)\]]?/gi, "")
          .trim();
        if (isMulti) {
          cleanName = cleanName + " [Multiano]";
          // Fornece lid de etapa vinculada da escola para ser aceito pelo backend antigo e novo sem falhar validação
          const school = sch(c.sid);
          c.lid = (school && school.lids && school.lids[0]) ? school.lids[0] : (D.levels[0]?.id || "l1");
        }
        if (sh) {
          c.name = cleanName + " [" + sh + "]";
          c.shift = sh;
        } else {
          c.name = cleanName;
        }
      }
      return c;
    };
    const P = (k, o, n) => ({ t: "put", k, o: ser(k, o), n: n ? 1 : 0 }), X = (k, id) => ({ t: "del", k, id }), ordOps = k => D[k].map(o => P(k, o));
    function adopt(r) {
      D = Object.assign(vazio(), r.data);
      if (D.periods) {
        D.periods.forEach(p => { if (!p.yid) p.yid = D.cur || "y1"; });
      }
      normalizarTurmas(D.classes);
      normalizarAlunos(D.students, D.classes);
      S.user = r.role == "admin" ? { role: "admin" } : { role: "coord", name: r.name, sids: D.schools.map(s => s.id) };
      if (S.sid && !sch(S.sid)) { S.sid = null; S.cid = null }
      if (S.cid && !D.classes.some(c => c.id == S.cid)) S.cid = null;
      if (S.fp && !per(S.fp)) S.fp = ""; if (S.fs && !sch(S.fs)) S.fs = ""; if (S.fl && !D.levels.some(l => l.id == S.fl)) S.fl = "";
      try { localStorage.setItem(CK, JSON.stringify({ data: r.data, role: r.role, name: r.name, token: TOK })) } catch (e) { }
      if (S.user && S.user.role == "admin") { setTimeout(garantirEscolasRede, 100); }
    }
    const ESCOLAS_CANOA = [
      "ESCOLA DEP. MANOEL PEREIRA FILHO",
      "ESCOLA DEP. JOSÉ LÚCIO DE MELO",
      "ESCOLA NOSSA SENHORA APARECIDA",
      "ESCOLA PRES. GARRASTAZU MÉDICI",
      "ESCOLA VER. JOSÉ BEZERRA LEITE",
      "ESCOLA JOÃO ANGELINO DOS SANTOS",
      "ESCOLA JOSÉ BERNARDES NETO",
      "ESCOLA DOM PEDRO II",
      "ESCOLA JOSÉ FRANCISCO DE BRITO",
      "ESCOLA JOSÉ JOVINO DA SILVA",
      "ESCOLA JOSÉ ROCHA DOS SANTOS",

        const turmasContadas = new Set(cl.filter(c => stu(c.id).some(s => sLid(s, c) == l.id))).size;
        const q = { w: ESC.map(() => 0), r: LEI.map(() => 0), n: alunosAno.length, av: 0 };

        q.sw = q.w.reduce((a, b) => a + b, 0); q.sr = q.r.reduce((a, b) => a + b, 0);

      // MODO 4: TODOS (PLANILHA COMPLETA OTIMIZADA)

        ["Nível 3", "Pré-leitor · Nível 3"],

        ["L. Fluent.", "Leitor fluente"]

      const row = (c, t, b) => `<tr ${b ? 'class="tot"' : ""}>
        <td style="text-align:left;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px" title="${b ? "" : esc(c?.prof || "")}">${b ? "TOTAL" : esc(c?.prof || "—")}</td>
        <td>${b ? "—" : `<span class="badge" style="margin:0;font-weight:700;background:var(--bg)">${esc(c.name)}</span>`}</td>

        <td>${b ? "—" : (c.shift ? `<span class="badge" style="margin:0;font-size:.72rem;background:#F8FAFC;color:#475569;border-color:#E2E8F0">${esc(c.shift)}</span>` : `<span style="color:#CBD5E1">—</span>`)}</td>

    function aDiag() {

      return `<div class="card noprint">

    }
    const addBox = (t, f, b) => `<div class="card"><h3>${t}</h3>${f}<p style="margin:14px 0 0">${b}</p></div>`;
    const chkL = (ids, cls) => D.levels.map(l => `<label><input type="checkbox" class="${cls}" value="${l.id}" ${ids.includes(l.id) ? "checked" : ""}>${esc(l.name)}</label>`).join("");
        
    async function cadastrarEscolasRede(btn) {
      if (btn) { btn.disabled = true; btn.textContent = "Gravando na planilha…"; }
      const allLids = D.levels.length ? D.levels.map(l => l.id) : ["l1", "l2", "l3", "l4", "l5"];
      const ops = [];
      let criadas = 0;
      ESCOLAS_CANOA.forEach(nome => {
        const jaTem = D.schools.some(s => s.name.trim().toUpperCase() === nome.trim().toUpperCase());
        if (!jaTem) {
          const s = { id: uid(), name: nome.trim(), lids: allLids };
          D.schools.push(s);
          ops.push(P("schools", s, 1));
          criadas++;
        }
      });
      if (ops.length) {
        D.schools.sort((a, b) => (a.name || "").localeCompare(b.name || "", "pt-BR"));
        await commit(ops, true);
      }
      if (btn) { btn.disabled = false; btn.textContent = "⚡ Cadastrar escolas da rede"; }
      render();
      alert(criadas > 0 ? (criadas + " escolas cadastradas e salvas na planilha com sucesso!") : "Todas as 20 escolas já estão cadastradas.");
    }
    function aEscolas() {
      const faltam = ESCOLAS_CANOA.filter(nome => !D.schools.some(s => s.name.trim().toUpperCase() === nome.toUpperCase()));
      const bannerRede = faltam.length > 0 ? `<div class="card" style="border:1.5px solid var(--g);background:var(--gs);margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
          <div>
            <h3 style="margin:0 0 4px;color:var(--gd)">Cadastrar Escolas Municipais da Rede</h3>
            <p style="margin:0;font-size:.85rem;color:var(--ink)">Existem <b>${faltam.length}</b> escola(s) da rede municipal de Lagoa da Canoa prontas para serem cadastradas na planilha com todas as etapas vinculadas.</p>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn" onclick="cadastrarEscolasRede(this)">⚡ Cadastrar ${faltam.length} escolas da rede</button>
            <button class="btn" style="background:#0F5132;border-color:#0F5132" onclick="carregarDadosReais(this)">⚡ Carregar Todas as Turmas e Alunos Reais</button>
          </div>

      if (t == "coord") D.coords = D.coords.filter(k => k.cpf != id);

      commit([X({ school: "schools", class: "classes", level: "levels", coord: "coords", period: "periods" }[t], id)]); render()

      if (!s) return `${back}<div class="hello"><h2>Escola não encontrada</h2></div>`;
      if (S.dg) return `${back}<button class="crumb" onclick="go({dg:false})">← Voltar às turmas</button><div class="card noprint"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center"><div><h3 style="margin:0 0 4px">Diagnóstico · ${esc(s.name)}</h3><p style="margin:0;font-size:.84rem;color:var(--mut)">Resultados de escrita e leitura da sua escola.</p></div>${acoes}</div><div class="grid" style="margin-top:12px;margin-bottom:12px">${perSel().replace("go({fp:this.value})", "go({fp:this.value,pid:this.value})")}${lvSel()}${shSel()}</div>${diagViewSwitcher()}</div>${printHead("Diagnóstico de escrita e leitura")}${diagTable(S.sid, S.fp)}`;
      if (!op.length) return `${back}<div class="hello"><h2>${esc(s.name)}</h2></div><div class="card empty">Nenhum período está aberto para preenchimento no momento.<br>Aguarde a liberação pela Secretaria de Educação.</div>`;

      }
      return `<button class="crumb" onclick="go({cid:null})">← Voltar às turmas</button>` + lancar()
    }
    
    
    let _filtroAlunosTexto = "", _filtroAlunosStatus = "all", _filtroAlunosLid = "all";

    function chgStuLid(sid, lid) {
      const s = W.list.find(x => x.id === sid);
      if (s) {
        s.lid = lid;
        aplicarFiltrosAlunos();
      }
    }
    function filtrarAlunosLid(lid) {

      document.querySelectorAll(".btn-flid").forEach(b => b.classList.toggle("on", b.dataset.lid === lid));
      aplicarFiltrosAlunos();
    }

    function statusAluno(rec) {
      const x = rec || ["", ""];
      if (x[0] && x[1]) return { cls: "ok", txt: "✓ Avaliado" };
      if (x[0] || x[1]) return { cls: "parcial", txt: "● Parcial" };
      return { cls: "pendente", txt: "Pendente" };
    }

    function lancar() {
      const c = cls(S.cid); if (!c) return '<p class="empty">Turma não encontrada.</p>';
      const adm = S.user.role == "admin", ps = adm ? yPer(D.cur) : openP();
      const n = W.list.length, av = W.list.filter(s => { const x = W.r[s.id] || []; return x[0] && x[1]; }).length;
      const pctAv = n ? Math.round((av / n) * 100) : 0;

      return `${adm ? '<button class="crumb" onclick="go({tab:\'turmas\',cid:null})">← Voltar às turmas</button>' : ''}
      <div class="hero-turma">
        <div class="hero-turma-top">
          <div class="hero-turma-info">
            <h2>
              <span>${esc(c.name)}</span>
              <span class="hero-badge-ano" style="${c.lid == 'multi' ? 'background:var(--ps);color:#800036;border-color:rgba(232,0,95,.25)' : ''}">${esc(lname(c.lid))}</span>${c.shift ? `<span class="hero-badge-ano" style="background:var(--os);color:#8A4A0B;border-color:rgba(244,123,32,.25)">${esc(c.shift)}</span>` : ""}
            </h2>
            <div class="hero-meta">
              <span>${esc(sch(c.sid)?.name || "")} · Turno: <b>${esc(c.shift || "Não informado")}</b> · Professor(a): <b>${esc(c.prof || "—")}</b></span>
            </div>
          </div>
          <div class="hero-prog-box">
            <div id="prog"></div>
            <div class="prog-track"><div class="prog-fill" id="prog-bar-fill" style="width:${pctAv}%"></div></div>
            <div style="display:flex;gap:8px;margin-top:2px">
              <button class="btn" onclick="salvar()" style="height:34px;padding:0 14px;font-size:.82rem">Salvar alterações</button>
            </div>
          </div>
        </div>
        <div class="bimes-pills">
          ${ps.map(p => `<button class="bimes-pill ${p.id == S.pid ? "on" : ""}" onclick="setP('${p.id}')">
            ${esc(p.name)}
          </button>`).join("")}
        </div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px">
          <h3 style="margin:0">Resumo da turma</h3>
          <span style="font-size:.84rem;color:var(--mut)">Cálculo automático do período selecionado</span>
        </div>
        <div id="sum"></div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px">
          <div>
            <h3 style="margin:0 0 2px">Alunos · escrita e leitura</h3>
            <p style="margin:0;font-size:.85rem;color:var(--mut)">Selecione o nível de escrita e leitura de cada aluno.</p>
          </div>
          <button class="ghost" style="height:34px;font-size:.82rem" onclick="ordenarAlunosAZ()">Ordenar A–Z</button>
        </div>

        <div class="table-toolbar">
          <div class="search-box">
            <input type="text" placeholder="Buscar aluno por nome..." value="${_filtroAlunosTexto}" oninput="filtrarAlunosTexto(this.value)">
          </div>
          <div class="filter-pills">
            <button class="filter-btn ${_filtroAlunosStatus === 'all' ? 'on' : ''}" id="fbtn_all" onclick="filtrarAlunosStatus('all')">Todos (<span id="cnt_f_all">${n}</span>)</button>
            <button class="filter-btn ${_filtroAlunosStatus === 'ok' ? 'on' : ''}" id="fbtn_ok" onclick="filtrarAlunosStatus('ok')">Avaliados (<span id="cnt_f_ok">${av}</span>)</button>
            <button class="filter-btn ${_filtroAlunosStatus === 'pen' ? 'on' : ''}" id="fbtn_pen" onclick="filtrarAlunosStatus('pen')">Pendentes (<span id="cnt_f_pen">${n - av}</span>)</button>
          </div>
        </div>
        ${c.lid === 'multi' ? `
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding:8px 12px;background:var(--bg);border-radius:10px;border:1px solid var(--ln)">
          <span style="font-size:.76rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;margin-right:4px">Filtrar por Ano da Turma:</span>

          ${(sch(c.sid)?.lids || D.levels.map(l => l.id)).map(lid => {
            const lObj = D.levels.find(l => l.id === lid);
            if (!lObj) return "";
            const countL = W.list.filter(s => (s.lid || "") === lid).length;
            return `<button class="filter-btn btn-flid ${_filtroAlunosLid === lid ? 'on' : ''}" data-lid="${lid}" onclick="filtrarAlunosLid('${lid}')">${esc(lObj.name)} (${countL})</button>`;
          }).join("")}
        </div>` : ''}

        <div class="tw">
          <table class="lt">
            <thead>
              <tr>
                <th style="width:36px">Nº</th>
                <th style="min-width:200px">Aluno(a)</th>
                ${c.lid === 'multi' ? '<th style="width:130px">Ano Escolar</th>' : ''}
                <th style="min-width:160px">Escrita</th>
                <th style="min-width:160px">Leitura</th>

        ${isMulti ? `<td>

    const selN = (aid, k, L, v) => {
      const idx = L.findIndex(e => e[0] == v);

      const style = idx >= 0
        ? `background-color:${cor}15;border-color:${cor};color:${cor};font-weight:700`
        : `background-color:var(--sf);border-color:var(--ln);color:var(--mut)`;

      </select>`;
    };

    function setNivel(aid, k, el) {

      const idx = L.findIndex(e => e[0] == el.value);
      if (idx >= 0) {
        el.style.backgroundColor = `${COR[idx]}18`;
        el.style.borderColor = COR[idx];
        el.style.color = COR[idx];
        el.style.fontWeight = "700";
      } else {
        el.style.backgroundColor = "var(--sf)";

    function filtrarAlunosTexto(txt) {

    }

    function filtrarAlunosStatus(st) {
      _filtroAlunosStatus = st;

        if (btn) btn.classList.toggle("on", id === st);
      });
      aplicarFiltrosAlunos();
    }

    function aplicarFiltrosAlunos() {
      const rows = document.querySelectorAll("#rows tr");
      let visiveis = 0;
      rows.forEach(r => {
        const name = r.dataset.name || "";
        const status = r.dataset.status || "";
        const matchTxt = !_filtroAlunosTexto || name.includes(_filtroAlunosTexto);
        const matchSt = _filtroAlunosStatus === "all" ||
                        (_filtroAlunosStatus === "ok" && status === "ok") ||
                        (_filtroAlunosStatus === "pen" && status !== "ok");
        const rLid = r.dataset.lid || "";
        const matchLid = _filtroAlunosLid === "all" || rLid === _filtroAlunosLid;
        const show = matchTxt && matchSt && matchLid;
        r.style.display = show ? "" : "none";
        if (show) visiveis++;
      });
      const v = document.getElementById("vazio");
      if (v) v.hidden = visiveis > 0 || !W.list.length;
    }

    function ordenarAlunosAZ() {
      W.list.sort((a, b) => (a.name || "").localeCompare(b.name || "", "pt-BR"));
      const tbody = document.getElementById("rows");
      if (tbody) tbody.innerHTML = W.list.map(rowAluno).join("");
      aplicarFiltrosAlunos();
    }

    function addAlunos() {
      const t = $("#nl").value.split("\n").map(x => x.trim()).filter(Boolean);
      if (!t.length) return;
      const c = cls(S.cid);
      const isMulti = c && c.lid === "multi";
      const selLid = ($("#add_stu_lid") ? $("#add_stu_lid").value : "") || (!isMulti && c ? c.lid : "");
      t.forEach(n => {
        let cleanName = n, lid = selLid;
        const m = n.match(/\s*[-–(\[]\s*([1-5]º?\s*Ano|[1-5]º?)\s*[\)\]]?/i);
        if (m) {
          const num = m[1].replace(/\D/g, "");
          const found = D.levels.find(l => l.name.includes(num + "º"));
          if (found) lid = found.id;
          cleanName = n.replace(m[0], "").trim();
        }
        const s = { id: uid(), name: cleanName, lid: lid };
        W.list.push(s);
        W.r[s.id] = ["", ""];
      });
      $("#nl").value = "";
      render();
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }

    function rmAluno(i) {
      const s = W.list[i];
      if (!confirm("Remover " + s.name + " da turma? Os níveis dele(a) em todos os períodos serão apagados ao salvar.")) return;
      W.list.splice(i, 1);
      delete W.r[s.id];
      render();
    }

    function upd() {
      const sm = $("#sum"), pg = $("#prog");
      if (!sm) return;
      const L = W.list, n = L.length;
      const av = L.filter(s => { const x = W.r[s.id] || []; return x[0] && x[1]; }).length;
      const pctAv = n ? Math.round((av / n) * 100) : 0;

      // Contagem por nível
      const cnt = (LL, k) => LL.map((e, i) => L.filter(s => (W.r[s.id] || [])[k] == e[0]).length);
      const wCounts = cnt(ESC, 0), rCounts = cnt(LEI, 1);
      const sw = wCounts.reduce((a, b) => a + b, 0);
      const sr = rCounts.reduce((a, b) => a + b, 0);
      const alfCount = (wCounts[4] || 0) + (wCounts[5] || 0);
      const fluCount = (rCounts[4] || 0) + (rCounts[5] || 0);
      const pctAlf = sw ? Math.round((alfCount / sw) * 100) : 0;
      const pctFlu = sr ? Math.round((fluCount / sr) * 100) : 0;

      // Render da Seção de Níveis com visual nativo
      const renderSec = (titulo, dotCor, LL, a, sTotal) => `
        <div class="diag-section">
          <div class="diag-section-header">
            <div class="diag-title-group">
              <i class="dot" style="background:${dotCor}"></i>
              <span class="diag-title-text">${titulo}</span>
            </div>
            <span style="font-size:.82rem;color:var(--mut)">${sTotal} avaliados</span>
          </div>
          <div class="diag-grid-cards">
            ${LL.map((e, i) => `
              <div class="diag-card" style="border-left-color:${COR[i]}">
                <b class="diag-card-num" style="color:var(--navy)">${a[i]}</b><br>
                <small class="diag-card-name" style="color:var(--mut)">${e[2]}</small>
                <div class="diag-card-pct" style="color:${COR[i]}">${sTotal ? pct(a[i], sTotal) : 0}%</div>
              </div>
            `).join("")}
          </div>
          ${sbar(a, LL)}
        </div>
      `;

      sm.innerHTML = `
        <div class="diag-kpi-grid">
          <div class="diag-kpi-card">
            <div class="diag-kpi-label">Total de alunos</div>
            <div class="diag-kpi-num">${n}</div>
            <div class="diag-kpi-sub">Matriculados na turma</div>
          </div>
          <div class="diag-kpi-card">
            <div class="diag-kpi-label">Avaliados completos</div>
            <div class="diag-kpi-num" style="color:var(--gd)">${av} <small style="font-size:.82rem;color:var(--mut)">(${pctAv}%)</small></div>
            <div class="diag-kpi-sub">${n - av} pendente(s)</div>
          </div>
          <div class="diag-kpi-card">
            <div class="diag-kpi-label">Alfabético ou Ortográfico</div>
            <div class="diag-kpi-num" style="color:#2F7D5B">${pctAlf}%</div>
            <div class="diag-kpi-sub">${alfCount} de ${sw || 0} alunos com escrita</div>
          </div>
          <div class="diag-kpi-card">
            <div class="diag-kpi-label">Leitores Iniciantes ou Fluentes</div>
            <div class="diag-kpi-num" style="color:#2F7D5B">${pctFlu}%</div>
            <div class="diag-kpi-sub">${fluCount} de ${sr || 0} alunos com leitura</div>
          </div>
        </div>
        ${renderSec("Níveis de escrita", "#F47B20", ESC, wCounts, sw)}
        ${renderSec("Níveis de leitura", "#2F7D5B", LEI, rCounts, sr)}
      `;

      if (pg) {
        pg.innerHTML = !n ? '<span class="badge x" style="margin:0">Sem alunos</span>'
          : av === n ? `<span class="badge" style="margin:0">✓ ${av}/${n} alunos avaliados</span>`
          : av ? `<span class="badge w" style="margin:0">● ${av}/${n} alunos avaliados</span>`
          : '<span class="badge x" style="margin:0">Pendente: ninguém avaliado ainda</span>';
      }

      const pFill = document.getElementById("prog-bar-fill");
      if (pFill) pFill.style.width = pctAv + "%";

      const ssbProg = document.getElementById("ssb-progress");
      if (ssbProg) ssbProg.textContent = `${av} de ${n} alunos avaliados (${pctAv}%)`;

      const cntAll = document.getElementById("cnt_f_all");
      const cntOk = document.getElementById("cnt_f_ok");
      const cntPen = document.getElementById("cnt_f_pen");
      if (cntAll) cntAll.textContent = n;
      if (cntOk) cntOk.textContent = av;
      if (cntPen) cntPen.textContent = n - av;

      const v = $("#vazio");
      if (v) v.hidden = !!n;
    }

    async function salvar() {
      const c = cls(S.cid), pid = S.pid, fe = $("#fe"), b = $("#sf");
      fe.innerHTML = "";
      if (!c || !pid) return;
      const list = W.list.filter(s => s.name), r = {};
      list.forEach(s => {
        const x = W.r[s.id] || ["", ""];
        if (x[0] || x[1]) r[s.id] = [x[0] || "", x[1] || ""];
      });
      const faltam = list.filter(s => !(r[s.id] && r[s.id][0] && r[s.id][1])).length;
      if (faltam && !confirm(faltam + " aluno(s) estão sem escrita ou leitura. Salvar mesmo assim (preenchimento parcial)?")) return;
      const novos = new Set(list.map(s => s.id));
      stu(c.id).forEach(s => { if (!novos.has(s.id)) delete D.rec[s.id]; });
      D.students = D.students.filter(s => s.cid != c.id).concat(list.map(s => ({ id: s.id, cid: c.id, name: s.name, lid: s.lid || (c.lid !== "multi" ? c.lid : "") })));
      list.forEach(s => {
        D.rec[s.id] = D.rec[s.id] || {};
        if (r[s.id]) D.rec[s.id][pid] = r[s.id];
        else delete D.rec[s.id][pid];
      });

      const botoesSalvar = document.querySelectorAll("#sf, .hero-prog-box button");
      botoesSalvar.forEach(btn => { btn.disabled = true; btn.textContent = "Salvando…"; });

      const res = await commit([
        { t: "stu", cid: c.id, list: list.map(s => {
          let cleanName = (s.name || "").replace(/\s*[-–(\[]\s*([1-5]º?\s*Ano|[1-5]º?)\s*[\)\]]?/gi, "").trim();
          const finalLid = s.lid || (c.lid !== "multi" ? c.lid : "");
          if (c.lid === "multi" && finalLid) {
            cleanName = cleanName + " [" + lname(finalLid) + "]";
          }
          return { id: s.id, name: cleanName, lid: finalLid };
        }) },
        { t: "rec", cid: c.id, pid, r }
      ], true);

      botoesSalvar.forEach(btn => { btn.disabled = false; btn.textContent = "Salvar preenchimento"; });

      if (!res.ok) {
        fe.innerHTML = `<div class="err">${esc(res.err || "Não foi possível salvar na planilha.")}</div>`;
        return;
      }
      initW(c.id);
      const msgOk = $("#fo");
      if (msgOk) msgOk.textContent = "✓ Salvo na planilha";
      setTimeout(() => {
        const o = $("#fo");
        if (o) o.textContent = "";
      }, 3500);
      upd();
    }

        render(); if (S.user) iniciarAuto(); restaurar();
  </script>
</body>
